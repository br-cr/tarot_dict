name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_API: "34"
      NDK_VERSION: "25.2.9519653"
      SDK_DIR: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            buildozer==1.5.0 \
            Cython==0.29.36

      - name: Install Android command line tools
        run: |
          mkdir -p "$SDK_DIR/cmdline-tools"

          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O /tmp/cmdline-tools.zip

            unzip -q /tmp/cmdline-tools.zip \
              -d /tmp/cmdline-tools

            mv /tmp/cmdline-tools/cmdline-tools \
              "$SDK_DIR/cmdline-tools/latest"
          fi

          mkdir -p "$SDK_DIR/tools/bin"

          ln -sf \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"

          ln -sf \
            "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" \
            "$SDK_DIR/tools/bin/avdmanager"

          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true

          sdkmanager --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true

      - name: Clean previous Buildozer build
        run: |
          rm -rf .buildozer

      - name: Verify environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -f buildozer.spec
          test -f main.py

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          PATH: ${{ env.JAVA_HOME }}/bin:${{ env.PATH }}

          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b

        run: |
          set -o pipefail

          java -version

          buildozer android clean

          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TarotDict-APK
          path: bin/*.apk