name: Compilar APK con Buildozer

# Se ejecuta cada vez que subís cambios a la rama "main",
# y también podés dispararlo a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04 (NO ubuntu-latest/24.04): el NDK viejo que usa Buildozer
    # (r25b) es compatible con la glibc de esta versión.
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3.10 python3.10-venv \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5 libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Crear venv con Python 3.10 explícito
        # IMPORTANTE: el runner de GitHub trae varias versiones de Python
        # instaladas (incluida una 3.14 con el pip roto que ya vimos
        # fallar). Si dejamos que Buildozer use "python" a secas, puede
        # resolver a esa 3.14 rota en subprocesos internos (p.ej. cuando
        # arma un venv temporal para instalar dependencias puras de
        # Python). Forzamos explícitamente /usr/bin/python3.10 acá, y como
        # activamos este venv en todos los pasos siguientes, cualquier
        # subproceso que Buildozer dispare internamente hereda esta misma
        # versión de Python.
        run: /usr/bin/python3.10 -m venv "$HOME/venv-buildozer"

      - name: Instalar Buildozer y Cython
        run: |
          source "$HOME/venv-buildozer/bin/activate"
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Compilar el APK
        run: |
          source "$HOME/venv-buildozer/bin/activate"
          yes | buildozer -v android debug

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: diccionariotarot-apk
          path: bin/*.apk