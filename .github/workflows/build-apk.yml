name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies & Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk libffi-dev build-essential ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
        pip install --upgrade pip
        pip install buildozer cython

    # PASO CLAVE: Forzar la aceptación de licencias de Android SDK antes de compilar
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | python3 -c "
import os
import subprocess

# Pre-aceptar licencias creando las firmas en el directorio de licencias del SDK
sdk_dir = os.path.expanduser('~/.buildozer/android/platform/android-sdk')
lic_dir = os.path.join(sdk_dir, 'licenses')
os.makedirs(lic_dir, exist_ok=True)

licenses = {
    'android-sdk-license': '89330d2222116a3a569d10727f322b2600005251\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63c6825ea9c5514f83c2829b004d1fee',
    'android-sdk-preview-license': '84831b9409646a918e30573bab4c9c91346d8abd',
    'intel-android-sysimage-license': 'd975f751698a778109bf03cfd920f70e13233d68'
}

for lic_name, lic_content in licenses.items():
    with open(os.path.join(lic_dir, lic_name), 'w') as f:
        f.write(lic_content)
"

    - name: Build with Buildozer
      run: |
        # Usamos yes para responder 'y' automáticamente a cualquier prompt de licencias pendiente
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: bin/*.apk