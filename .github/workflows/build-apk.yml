name: Compilar APK con Buildozer

# Se ejecuta cada vez que subís cambios a la rama "main",
# y también podés dispararlo a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Compilar el APK con el contenedor oficial de Kivy
        # Usamos docker run directo (la imagen oficial kivy/buildozer) en vez
        # de una action de terceros: así el build queda 100% autocontenido
        # dentro del contenedor (mismo NDK/glibc consistentes, sin mezclar
        # headers del runner) y evitamos depender de que un tercero mantenga
        # su propio Dockerfile actualizado. El runner de GitHub es Linux
        # x86_64 nativo, así que tampoco hay emulación de por medio (a
        # diferencia de correr esto en un Mac Apple Silicon).
        run: |
          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$PWD":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: diccionariotarot-apk
          path: bin/*.apk