name: Compilar APK con Buildozer

# Se ejecuta cada vez que subís cambios a la rama "main",
# y también podés dispararlo a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04 (NO ubuntu-latest/24.04): el NDK viejo que usa Buildozer
    # (r25b) es compatible con la glibc de esta versión. En 24.04 falla con
    # el error "__GNUC_PREREQ is not defined" (bug conocido y sin fix en
    # Buildozer todavía).
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5 libtinfo6 cmake libffi-dev libssl-dev automake

      - name: Instalar Buildozer y Cython
        # Nada de Docker acá: instalamos Buildozer directo con el pip del
        # sistema (Python 3.10 en ubuntu-22.04), evitando así el bug de pip
        # roto que tenía la imagen kivy/buildozer:latest con Python 3.14.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython==0.29.36

      - name: Compilar el APK
        run: |
          yes | buildozer -v android debug

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: diccionariotarot-apk
          path: bin/*.apk