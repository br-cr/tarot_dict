name: Compilar APK con Buildozer

# Se ejecuta cada vez que subís cambios a la rama "main",
# y también podés dispararlo a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # IMPORTANTE: NO usar "ubuntu-latest". Desde que GitHub cambió ese alias
    # a Ubuntu 24.04, el NDK viejo que usa Buildozer (r25b) queda expuesto a
    # headers de glibc demasiado nuevos y falla al compilar el código C de
    # Kivy con el error "function-like macro '__GNUC_PREREQ' is not
    # defined". Es un problema conocido y reportado (kivy/buildozer#1900),
    # sin fix todavía dentro de Buildozer/NDK r25b — se evita fijando el
    # runner a Ubuntu 22.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Compilar el APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: diccionariotarot-apk
          path: ${{ steps.buildozer.outputs.filename }}