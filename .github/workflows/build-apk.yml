name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker pull kivy/buildozer:latest

          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest -c '
              set -euo pipefail

              # Permitir ejecución como root en el entorno CI
              export BUILDOZER_ALLOW_ROOT=1

              SDK_ROOT=/home/user/.buildozer/android/platform/android-sdk
              mkdir -p "$SDK_ROOT"
              cd /tmp

              # Install curl/unzip if missing
              if ! command -v curl >/dev/null 2>&1; then
                echo "Installing curl and unzip..."
                apt-get update -y
                apt-get install -y --no-install-recommends curl unzip ca-certificates
                rm -rf /var/lib/apt/lists/*
              fi

              # Download and install Android commandline-tools if missing
              if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
                echo "Downloading Android commandline tools..."
                curl -sSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
                unzip -q commandlinetools.zip -d "$SDK_ROOT/cmdline-tools.tmp"
                mkdir -p "$SDK_ROOT/cmdline-tools/latest"
                mv "$SDK_ROOT/cmdline-tools.tmp/cmdline-tools"/* "$SDK_ROOT/cmdline-tools/latest/"
                rm -rf "$SDK_ROOT/cmdline-tools.tmp" commandlinetools.zip
              fi

              export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

              # Install platform-tools, platform and build-tools
              yes | sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

              # Accept licenses non-interactively
              yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true

              # Run buildozer
              buildozer android debug
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarotDict-APK
          path: bin/*.apk